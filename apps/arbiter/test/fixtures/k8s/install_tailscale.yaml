# Arbiter cluster node mesaana-k3s -- rendered by the primary. This file contains no
# secret: no join token, no node credential, no CA key. Create the join Secret
# separately (the token is read from your terminal):
#   read -rs T && printf %s "$T" | kubectl -n arbiter-workers create secret generic arbiter-join --from-file=token=/dev/stdin
# bootstrap (cluster-admin, once) comes first, then node.
---
apiVersion: v1
kind: Namespace
metadata:
  labels:
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/warn: restricted
  name: arbiter-workers

---
apiVersion: scheduling.k8s.io/v1
description: 'Arbiter worker pods: every other workload wins a contention.'
globalDefault: false
kind: PriorityClass
metadata:
  name: arbiter-worker
preemptionPolicy: Never
value: -100

---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: arbiter-workers
  namespace: arbiter-workers
spec:
  hard:
    limits.cpu: 5500m
    limits.memory: 11008Mi
    pods: '4'
    requests.cpu: 2450m
    requests.ephemeral-storage: 12Gi
    requests.memory: 5056Mi

---
apiVersion: v1
kind: LimitRange
metadata:
  name: arbiter-workers
  namespace: arbiter-workers
spec:
  limits:
    - default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        ephemeral-storage: 128Mi
        memory: 128Mi
      type: Container

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: arbiter-workers
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: worker-to-controller
  namespace: arbiter-workers
spec:
  egress:
    - ports:
        - port: 9443
          protocol: TCP
        - port: 9444
          protocol: TCP
      to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: controller
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-ingress-from-workers
  namespace: arbiter-workers
spec:
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/component: worker
      ports:
        - port: 9443
          protocol: TCP
        - port: 9444
          protocol: TCP
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: controller-egress
  namespace: arbiter-workers
spec:
  egress:
    - ports:
        - port: 6443
          protocol: TCP
        - port: 443
          protocol: TCP
      to:
        - ipBlock:
            cidr: 10.43.0.1/32
    - ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
      to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
    - ports:
        - port: 443
          protocol: TCP
        - port: 41641
          protocol: UDP
        - port: 3478
          protocol: UDP
      to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 10.42.0.0/16
              - 10.43.0.0/16
  podSelector:
    matchLabels:
      app.kubernetes.io/component: controller
  policyTypes:
    - Egress

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbiter-controller
  namespace: arbiter-workers

---
apiVersion: v1
automountServiceAccountToken: false
kind: ServiceAccount
metadata:
  name: arbiter-worker
  namespace: arbiter-workers

---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arbiter-controller
  namespace: arbiter-workers
rules:
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - create
      - get
      - list
      - watch
      - delete
  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get
  - apiGroups:
      - ""
    resources:
      - resourcequotas
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resourceNames:
      - arbiter-controller
    resources:
      - services
    verbs:
      - get
  - apiGroups:
      - ""
    resourceNames:
      - arbiter-node-credential
      - arbiter-controller-ca
    resources:
      - secrets
    verbs:
      - get
      - update
  - apiGroups:
      - ""
    resourceNames:
      - arbiter-ca
    resources:
      - configmaps
    verbs:
      - get
      - update
  - apiGroups:
      - coordination.k8s.io
    resourceNames:
      - arbiter-controller
    resources:
      - leases
    verbs:
      - get
      - update
  - apiGroups:
      - apps
    resourceNames:
      - arbiter-controller
    resources:
      - deployments
    verbs:
      - get
      - patch

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arbiter-controller
  namespace: arbiter-workers
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arbiter-controller
subjects:
  - kind: ServiceAccount
    name: arbiter-controller
    namespace: arbiter-workers

---
apiVersion: v1
kind: Secret
metadata:
  name: arbiter-node-credential
  namespace: arbiter-workers
type: Opaque

---
apiVersion: v1
kind: Secret
metadata:
  name: arbiter-controller-ca
  namespace: arbiter-workers
type: Opaque

---
apiVersion: v1
data:
  controller.yaml: |
    max_concurrent: 2
    namespace: arbiter-workers
    worker:
      limits:
        cpu: '2'
        memory: 4Gi
      requests:
        cpu: '1'
        ephemeral-storage: 4Gi
        memory: 2Gi
kind: ConfigMap
metadata:
  name: arbiter-controller-config
  namespace: arbiter-workers

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: arbiter-ca
  namespace: arbiter-workers

---
apiVersion: coordination.k8s.io/v1
kind: Lease
metadata:
  name: arbiter-controller
  namespace: arbiter-workers
spec: {}

---
apiVersion: v1
kind: Service
metadata:
  name: arbiter-controller
  namespace: arbiter-workers
spec:
  ports:
    - name: bridge
      port: 9443
      protocol: TCP
      targetPort: 9443
    - name: boot
      port: 9444
      protocol: TCP
      targetPort: 9444
  selector:
    app.kubernetes.io/name: arbiter-controller
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: arbiter-controller
  namespace: arbiter-workers
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arbiter-controller
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/component: controller
        app.kubernetes.io/name: arbiter-controller
    spec:
      containers:
        - env:
            - name: ARB_ROLE
              value: agent
            - name: ARB_AGENT_BACKEND
              value: k8s
            - name: ARB_PRIMARY_URL
              value: https://arbiter.tail1234.ts.net
            - name: ARB_NODE_NAME
              value: mesaana-k3s
            - name: ARB_K8S_SELF_UPGRADE
              value: 'true'
            - name: ARB_NODE_PROXY
              value: http://127.0.0.1:1055
          image: registry.example.test/arbiter/controller:0.2.43
          name: controller
          resources:
            limits:
              cpu: '1'
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /etc/arb/join
              name: join
              readOnly: true
            - mountPath: /etc/arb/config
              name: config
              readOnly: true
            - mountPath: /tmp
              name: tmp
        - env:
            - name: TS_USERSPACE
              value: 'true'
            - name: TS_OUTBOUND_HTTP_PROXY_LISTEN
              value: 127.0.0.1:1055
            - name: TS_EXTRA_ARGS
              value: --advertise-tags=tag:arbiter-node
            - name: TS_STATE_DIR
              value: /tmp/tailscale
            - name: TS_SOCKET
              value: /tmp/tailscaled.sock
            - name: TS_AUTHKEY
              valueFrom:
                secretKeyRef:
                  key: authkey
                  name: arbiter-tailscale
          image: ghcr.io/tailscale/tailscale:stable
          name: tailscale
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - "tailscale --socket=/tmp/tailscaled.sock status --json | grep -q '\"BackendState\": \"Running\"'"
            failureThreshold: 12
            periodSeconds: 5
          resources:
            limits:
              cpu: 500m
              memory: 256Mi
            requests:
              cpu: 50m
              memory: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            privileged: false
            readOnlyRootFilesystem: true
          volumeMounts:
            - mountPath: /tmp
              name: tmp
      priorityClassName: arbiter-worker
      securityContext:
        runAsGroup: 10001
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      serviceAccountName: arbiter-controller
      volumes:
        - name: join
          secret:
            optional: true
            secretName: arbiter-join
        - configMap:
            name: arbiter-controller-config
          name: config
        - emptyDir:
            sizeLimit: 512Mi
          name: tmp
