apiVersion: v2
name: arbiter-node
description: >-
  An Arbiter cluster node: the controller Deployment and its RBAC (mode node), the
  namespace guardrails around it (mode bootstrap), or both (mode all, the default).
type: application
# The release workflow stamps `version` and `appVersion` with the release being cut
# (`helm package --version X --app-version X`), so a chart is never older or newer than
# the controller image it installs (docs/design/remote-workers.md §20.5). These are the
# development placeholders.
version: 0.0.0
appVersion: 0.0.0
kubeVersion: ">=1.30.0-0"
home: https://github.com/serious-alchemy/arbiter
sources:
  - https://github.com/serious-alchemy/arbiter
keywords:
  - arbiter
  - worker
  - node
