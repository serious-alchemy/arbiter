{{- if and (include "arbiter-node.bootstrap" .) .Values.runtimeClass.create }}
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: {{ required "runtimeClass.create needs placement.runtimeClassName" .Values.placement.runtimeClassName }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
handler: {{ required "runtimeClass.create needs runtimeClass.handler" .Values.runtimeClass.handler }}
{{- end }}
