{{- if include "arbiter-node.node" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: arbiter-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: arbiter-controller
subjects:
  - kind: ServiceAccount
    name: arbiter-controller
    namespace: {{ .Release.Namespace }}
{{- end }}
