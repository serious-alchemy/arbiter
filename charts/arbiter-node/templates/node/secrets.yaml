{{- /*
Empty on purpose: the controller writes its credential and the CA key here at first boot,
so the chart never carries either. The only Secret with a payload is the join token, and
only for `--set-file join.token=...` (see values.yaml for what that costs).
*/ -}}
{{- if include "arbiter-node.node" . }}
apiVersion: v1
kind: Secret
metadata:
  name: arbiter-node-credential
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
type: Opaque
---
apiVersion: v1
kind: Secret
metadata:
  name: arbiter-controller-ca
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
type: Opaque
{{- if .Values.join.token }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.join.existingSecret }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
type: Opaque
stringData:
  token: {{ .Values.join.token | trim | quote }}
{{- end }}
{{- end }}
