{{- if include "arbiter-node.node" . }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbiter-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
---
# Worker pods get a powerless account that mounts no token (K§7).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: arbiter-worker
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
