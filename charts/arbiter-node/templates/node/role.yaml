{{- /*
K§7, namespaced only. The Deployment is get-only: Helm owns the controller's image (§20.7),
so a compromised controller cannot repoint it. Do not add a write verb here.
*/ -}}
{{- if include "arbiter-node.node" . }}
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: arbiter-controller
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "arbiter-node.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [create, get, list, watch, delete]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [resourcequotas]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [services]
    resourceNames: [arbiter-controller]
    verbs: [get]
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [arbiter-node-credential, arbiter-controller-ca]
    verbs: [get, update]
  - apiGroups: [""]
    resources: [configmaps]
    resourceNames: [arbiter-ca]
    verbs: [get, update]
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    resourceNames: [arbiter-controller]
    verbs: [get, update]
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [arbiter-controller]
    verbs: [get]
{{- end }}
