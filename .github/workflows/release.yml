name: Build and Publish Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag name to release (e.g. v0.1.0)"
        required: true
      sign:
        description: "Sign the GHCR images and chart with cosign (keyless)"
        type: boolean
        default: false

jobs:
  build:
    name: Build OTP Release
    runs-on: ubuntu-latest
    container:
      image: redhat/ubi8

    permissions:
      contents: write

    outputs:
      tag: ${{ steps.tag.outputs.name }}

    env:
      LANG: en_US.UTF-8
      LC_ALL: en_US.UTF-8
      ELIXIR_ERL_OPTIONS: "+fnu"
      MIX_ENV: prod
      # Stamped into the server release and the arb escript so `arb server
      # deploy` / `arb self-update` find their release source with no
      # ARB_RELEASE_REPO exported (ArbiterCli.ReleaseRepo, Arbiter.Version).
      ARB_BUILD_RELEASE_REPO: ${{ github.repository }}
      # Build every `rustler_precompiled` NIF from source inside this
      # container instead of downloading upstream's prebuilt artifact.
      #
      # Only `mdex_native` uses rustler_precompiled today, and its upstream
      # x86_64-unknown-linux-gnu artifact is linked against a glibc newer
      # than ubi8's: it requires symbols up to GLIBC_2.34, so v0.1.64 could
      # not boot on RHEL 8.10 / glibc 2.28 at all (#1728) — `kernel` died in
      # `on_load` and the deploy auto-rolled back. Building it here links it
      # against this image's glibc 2.28, which makes the release portable to
      # every host at or above the build image, the same as every other `.so`
      # we ship. The "Check shipped binaries…" step below enforces that.
      #
      # This is release-only: dev machines and the PR CI job leave the
      # variable unset and keep using the downloaded artifact, so they need
      # no Rust toolchain.
      RUSTLER_PRECOMPILED_FORCE_BUILD_ALL: "1"

    steps:
      - name: Install system dependencies
        run: |
          dnf install -y \
            git \
            curl \
            make \
            gcc \
            gcc-c++ \
            binutils \
            perl \
            perl-IPC-Cmd \
            ncurses-devel \
            unzip \
            tar \
            gzip \
            skopeo \
            which \
            glibc-langpack-en

      - uses: actions/checkout@v4

      # Erlang/OTP is built from source here, with OpenSSL linked statically
      # into the crypto NIF (#1977). The rabbitmq el8 RPM used until v0.1.69
      # linked it against this image's libcrypto.so.1.1, so the release could
      # not boot on any OpenSSL-3-only host (Fedora >= 36, Ubuntu >= 22.04,
      # Debian >= 12, RHEL 9). Versions and checksums are pinned in the
      # script; the cache is keyed on its contents. The "Check shipped
      # binaries…" steps below enforce the outcome on the packaged tarball.
      - name: Restore Erlang/OTP build cache
        id: otp-cache
        uses: actions/cache@v4
        with:
          path: /opt/otp
          key: otp-static-openssl-ubi8-${{ hashFiles('scripts/build-release-otp.sh') }}

      - name: Build Erlang/OTP 29 with static OpenSSL
        if: steps.otp-cache.outputs.cache-hit != 'true'
        run: |
          bash scripts/build-release-otp.sh --prefix /opt/otp

      - name: Put Erlang/OTP on PATH
        run: |
          echo "/opt/otp/bin" >> "$GITHUB_PATH"
          /opt/otp/bin/erl -noshell -eval 'ok = crypto:start(), io:format("~p~n", [crypto:info_lib()]), halt().'

      - name: Install Elixir 1.20
        run: |
          ELIXIR_VERSION="1.20.4"
          OTP_MAJOR="29"
          curl -fsSL "https://repo.hex.pm/builds/elixir/v${ELIXIR_VERSION}-otp-${OTP_MAJOR}.zip" -o /tmp/elixir.zip
          mkdir -p /opt/elixir
          unzip -q /tmp/elixir.zip -d /opt/elixir
          echo "/opt/elixir/bin" >> "$GITHUB_PATH"

      - name: Install Rust toolchain
        # Needed only because RUSTLER_PRECOMPILED_FORCE_BUILD_ALL is set for
        # this job (see the job `env` above): the mdex_native NIF is compiled
        # here rather than downloaded. Keep RUST_VERSION at or above the
        # `rust-version` in deps/mdex_native/native/mdex_native_nif/Cargo.toml.
        run: |
          RUST_VERSION="1.91.0"
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain "${RUST_VERSION}" --no-modify-path
          echo "${HOME}/.cargo/bin" >> "$GITHUB_PATH"
          "${HOME}/.cargo/bin/cargo" --version
          "${HOME}/.cargo/bin/rustc" --version

      - name: Verify UTF-8 locale
        run: |
          locale
          python3 -c "import locale; print(locale.getlocale())" || true

      - name: Bootstrap Hex and Rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Determine tag name
        id: tag
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "name=${TAG}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_VERSION=${TAG#v}" >> "$GITHUB_ENV"

      - name: Get production dependencies
        run: |
          MIX_ENV=prod mix deps.get --only prod

      - name: Install asset build tools
        run: |
          MIX_ENV=prod mix cmd --app arbiter_web mix assets.setup
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Compile (prod)
        run: |
          MIX_ENV=prod mix compile
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build and digest web assets
        run: |
          MIX_ENV=prod mix cmd --app arbiter_web mix assets.deploy

      - name: Build OTP release
        run: |
          MIX_ENV=prod mix release arbiter
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Build arb escript
        run: |
          cd apps/arbiter_cli && MIX_ENV=prod mix escript.build
        env:
          RELEASE_VERSION: ${{ steps.tag.outputs.name }}
          MIX_ENV: prod

      - name: Package and checksum release
        run: |
          TAG="${{ steps.tag.outputs.name }}"
          TARBALL="arbiter-${TAG}-linux.tar.gz"
          tar -czf "${TARBALL}" -C _build/prod/rel/arbiter .
          sha256sum "${TARBALL}" > "${TARBALL}.sha256"
          sha256sum apps/arbiter_cli/arb > arb.sha256
          # One migration name per line: lets a running server tell, before an
          # operator clicks "Update", whether the release carries migrations it
          # has not applied (Arbiter.Release.UpdateCheck).
          MANIFEST="arbiter-${TAG}-migrations.txt"
          (cd apps/arbiter/priv/repo/migrations && ls -1 *.exs | sed 's/\.exs$//' | sort) > "${MANIFEST}"
          echo "TARBALL=${TARBALL}" >> "$GITHUB_ENV"
          echo "MANIFEST=${MANIFEST}" >> "$GITHUB_ENV"

      - name: Check shipped binaries against the ubi8 glibc baseline
        # Last line of defence for #1728: fail the release here, naming the
        # file, rather than shipping a tarball that cannot boot on RHEL 8.
        # Runs against the packaged tarball, i.e. exactly what gets published.
        # Locally: scripts/check-release-glibc.sh _build/prod/rel/arbiter
        run: |
          bash scripts/check-release-glibc.sh --baseline 2.28 "${TARBALL}"

      - name: Check shipped binaries only link always-present system libraries
        # Last line of defence for #1977: a bundled .so / ELF binary whose
        # NEEDED libraries include anything outside the allowlist in the
        # script (glibc family, libgcc_s, libstdc++, libtinfo) fails the
        # release here, naming the file and the library — e.g. a crypto NIF
        # that links libcrypto.so.1.1 and so cannot boot on an OpenSSL-3 host.
        # Locally: scripts/check-release-shared-libs.sh _build/prod/rel/arbiter
        run: |
          bash scripts/check-release-shared-libs.sh "${TARBALL}"

      - name: Render the container build inputs for the GHCR job
        # KH7 (docs/design/remote-workers.md §20.8): the controller image and the
        # shared worker base are built from the Containerfiles the primary itself
        # uses (`mix arbiter.containerfile`), digest-pinned here, where Erlang/Elixir
        # already are; the publish-oci job below only needs docker and helm.
        # The controller tarball has a top-level `arbiter/` (the primary's own
        # layout), unlike the release asset, which unpacks to `.`.
        run: |
          mkdir -p dist
          (cd apps/arbiter \
            && mix arbiter.containerfile controller --pin --out "${GITHUB_WORKSPACE}/dist/Containerfile.controller" \
            && mix arbiter.containerfile worker-base --pin \
                 --out "${GITHUB_WORKSPACE}/dist/Containerfile.worker-base" \
                 --hash-out "${GITHUB_WORKSPACE}/dist/worker-base.hash")
          tar -czf dist/release.tar.gz -C _build/prod/rel arbiter

      - name: Upload the container build inputs
        uses: actions/upload-artifact@v4
        with:
          name: container-inputs
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: "Arbiter ${{ steps.tag.outputs.name }}"
          files: |
            ${{ env.TARBALL }}
            ${{ env.TARBALL }}.sha256
            ${{ env.MANIFEST }}
            apps/arbiter_cli/arb
            arb.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-oci:
    name: Publish controller image, chart and worker base to GHCR
    # KH7 (OD6): the controller image, the arbiter-node chart and the worker base are
    # public artefacts of a tagged release. Optional cosign signing is behind the
    # `sign` dispatch input or the repository variable RELEASE_COSIGN=true; it is never
    # a gate. Operator checks after the first release: the package visibility on the
    # GHCR packages page (H7) and an arm64 node (H4, the image is linux/amd64 only).
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write
      id-token: write

    env:
      TAG: ${{ needs.build.outputs.tag }}
      SIGN: ${{ inputs.sign == true || vars.RELEASE_COSIGN == 'true' }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the container build inputs
        uses: actions/download-artifact@v4
        with:
          name: container-inputs
          path: dist/

      - name: Work out names and versions
        run: |
          OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          # Chart `version` / `appVersion` and the image tag are the release without the
          # leading v: the chart's image tag defaults to its appVersion.
          VERSION="${TAG#v}"
          {
            echo "CONTROLLER=ghcr.io/${OWNER}/arbiter-controller"
            echo "WORKER_BASE=ghcr.io/${OWNER}/arbiter-worker-base"
            echo "CHARTS=oci://ghcr.io/${OWNER}/charts"
            echo "CHART_REPO=ghcr.io/${OWNER}/charts/arbiter-node"
            echo "VERSION=${VERSION}"
            echo "BASE_HASH=$(tr -d '[:space:]' < dist/worker-base.hash)"
            echo "BASE_IMAGE=$(grep -m1 '^FROM ' dist/Containerfile.controller | cut -d' ' -f2)"
          } >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the controller image
        id: controller
        uses: docker/build-push-action@v6
        with:
          # The Containerfile ADDs release.tar.gz from the context and copies nothing
          # else, so the rest of dist/ stays out of the image.
          context: dist
          file: dist/Containerfile.controller
          platforms: linux/amd64
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ env.CONTROLLER }}:${{ env.VERSION }}
            ${{ env.CONTROLLER }}:${{ env.TAG }}
          # `source` links the package to this repository, which is what lets a
          # public repository's package inherit public visibility (H7).
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=Arbiter controller (open-core release)
            arbiter.base-image=${{ env.BASE_IMAGE }}

      - name: Build and push the worker base
        id: base
        run: |
          REF="${WORKER_BASE}:${BASE_HASH}"
          # The tag is the content hash of the pinned Containerfile: an existing tag is
          # already this base, and re-pushing would only move its digest.
          if docker buildx imagetools inspect "${REF}" >/dev/null 2>&1; then
            echo "${REF} already published"
            docker buildx imagetools inspect "${REF}" --format '{{.Manifest.Digest}}' \
              | sed 's/^/digest=/' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p "${RUNNER_TEMP}/empty-context"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=false --sbom=false \
            --file dist/Containerfile.worker-base \
            --label "org.opencontainers.image.source=https://github.com/${GITHUB_REPOSITORY}" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.description=Arbiter shared worker image base" \
            --tag "${REF}" \
            --metadata-file "${RUNNER_TEMP}/base-metadata.json" \
            --push \
            "${RUNNER_TEMP}/empty-context"
          jq -r '"digest=" + .["containerimage.digest"]' "${RUNNER_TEMP}/base-metadata.json" >> "$GITHUB_OUTPUT"

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Package and push the chart
        id: chart
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          helm package charts/arbiter-node --version "${VERSION}" --app-version "${VERSION}" --destination dist
          echo "${GH_TOKEN}" | helm registry login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin
          helm push "dist/arbiter-node-${VERSION}.tgz" "${CHARTS}" 2>&1 | tee "${RUNNER_TEMP}/helm-push.log"
          DIGEST="$(sed -n 's/^Digest: //p' "${RUNNER_TEMP}/helm-push.log")"
          test -n "${DIGEST}" || { echo "helm push printed no digest" >&2; exit 1; }
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Install cosign
        if: env.SIGN == 'true'
        uses: sigstore/cosign-installer@v3

      - name: Sign the images and the chart (cosign, keyless)
        if: env.SIGN == 'true'
        # Identity is this workflow's GitHub OIDC token; verify with
        #   cosign verify <ref>@<digest> --certificate-oidc-issuer https://token.actions.githubusercontent.com \
        #     --certificate-identity-regexp '^https://github.com/<owner>/<repo>/\.github/workflows/release\.yml@'
        run: |
          cosign sign --yes "${CONTROLLER}@${{ steps.controller.outputs.digest }}"
          cosign sign --yes "${WORKER_BASE}@${{ steps.base.outputs.digest }}"
          cosign sign --yes "${CHART_REPO}@${{ steps.chart.outputs.digest }}"

      - name: Summary
        run: |
          {
            echo "### GHCR artefacts for ${TAG}"
            echo "- controller: \`${CONTROLLER}:${VERSION}@${{ steps.controller.outputs.digest }}\`"
            echo "- worker base: \`${WORKER_BASE}:${BASE_HASH}@${{ steps.base.outputs.digest }}\`"
            echo "- chart: \`${CHARTS}/arbiter-node:${VERSION}@${{ steps.chart.outputs.digest }}\`"
            echo "- cosign: ${SIGN}"
            echo
            echo "First release only: check the three packages are public (Package settings, Change visibility)."
          } >> "$GITHUB_STEP_SUMMARY"
