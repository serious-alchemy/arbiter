name: CI

# Cache scoping: GitHub lets a run restore caches saved on its own ref or on
# the default branch, never on a sibling PR ref. Nothing used to run on main,
# so no cache existed there and every PR started cold (and saved its own
# per-PR copy, pushing storage over the 10 GB quota). Now only the `push` to
# main run SAVES caches (the "Save ..." steps are gated on
# github.event_name == 'push'); PR runs only restore, falling back to main's.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Never cancel a main run: it is the one that seeds the caches.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Static analysis + security scan: the umbrella-root `mix audit` alias
  # (see mix.exs), which runs deps.unlock --check-unused, format
  # --check-formatted, compile --warnings-as-errors, credo --strict, sobelow
  # per app, and dialyzer.
  #
  # This job also subsumes the former `lint` job (mix precommit: compile
  # --warnings-as-errors, deps.unlock --check-unused, format check): the
  # `audit` alias already runs all three, so `lint` only repeated them. It
  # also raced `test` to save the identical MIX_ENV=test `-mix-` cache key.
  # Merged rather than re-keyed because that removes a runner and a cold
  # compile instead of just de-duplicating the cache.
  #
  # Same constraint as every other job here: the merger reads this check
  # run's conclusion and blocks the merge on anything but success, so this
  # job has to be able to stay green. It can — bd-4x2yhq triaged the entire
  # first pass to zero findings (see .credo.exs, the three .sobelow-conf
  # files, and .dialyzer_ignore.exs for what was fixed versus suppressed and
  # why). It fails only on a NEW finding, which is the point.
  #
  # MIX_ENV is dev rather than test: dialyzer analyses the code that ships,
  # and a test-env build pulls in `test/support` and swaps compile-time
  # config. The dev cache is this job's alone, hence the distinct cache key.
  audit:
    name: mix audit (credo, sobelow, dialyzer)
    runs-on: ubuntu-latest
    env:
      MIX_ENV: dev

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - name: Restore deps/build cache
        id: cache1
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-audit-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp29.1.1-elixir1.20.4-audit-

      # The PLT is cached separately from _build. It is derived entirely from
      # mix.lock plus the OTP/Elixir pair, it is worth hundreds of MB, and
      # building it from cold costs minutes — so it gets a key that only those
      # inputs move, and `restore-keys` lets a stale PLT be incrementally
      # updated rather than rebuilt when a single dep changes.
      #
      # `mix.exs` pins plt_core_path/plt_local_path to this one directory for
      # the umbrella root AND all three child apps (`../../priv/plts`), so
      # there is exactly one PLT here, not three.
      - name: Restore dialyzer PLT
        id: cache2
        uses: actions/cache/restore@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-plt-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp29.1.1-elixir1.20.4-plt-

      - name: Install hex/rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      - name: mix audit
        id: audit
        run: mix audit

      - name: Save deps/build cache
        if: ${{ !cancelled() && github.event_name == 'push' && steps.audit.outcome == 'success' && steps.cache1.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-audit-${{ hashFiles('**/mix.lock') }}

      - name: Save dialyzer PLT
        if: ${{ !cancelled() && github.event_name == 'push' && steps.audit.outcome == 'success' && steps.cache2.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: priv/plts
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-plt-${{ hashFiles('**/mix.lock') }}

  # NOTE: there was deliberately NO `mix test` job here for a while.
  #
  # A `mix test` job was added alongside this workflow and removed immediately
  # (bd-3c9ygz -> follow-up). The reason is specific and worth preserving:
  #
  # Arbiter's merger (apps/arbiter/lib/arbiter/mergers/github.ex,
  # map_check_run_status/1) reads EVERY check run's conclusion on the PR head
  # SHA and reports `pipeline: :failed` if any is non-success. The Watchdog
  # turns that into `:ci_failed`, dispatches a fix-pass, and eventually parks
  # the worker. GitHub's "required check" designation is not consulted, so a
  # merely-advisory job does not exist as far as Arbiter is concerned.
  #
  # The removed job tried to stay green with `mix test || echo "::warning::"`.
  # That does NOT work: the step swallows the exit code, but the job's
  # check-run conclusion still lands as `failure` (verified on run
  # 31242939298 — run conclusion `success`, check run `mix test` `failure`),
  # which is exactly what the merger reads. The result was a race: merges
  # succeeded only when the merger looked before CI finished.
  #
  # Restore a real, gating `mix test` job only after the pre-existing
  # order-dependent failures on main are fixed (Arbiter.Reviews.CheckoutTest,
  # Arbiter.Worker.RunProvenanceTest, et al). Until then tests gate locally
  # via `mix precommit`, not in CI.
  #
  # bd-9j4znl: those failures were root-caused to `Arbiter.DataCase` only
  # sweeping leaked `Arbiter.Worker.Supervisor` children for `async: false`
  # tests. A whole family of VM-global `DynamicSupervisor`s hold long-lived,
  # per-workspace worker/workflow GenServers (Worker, Watchdog, Machine,
  # MergeQueue, PRPatrol, ReviewPatrol, MergedPRFinalizer, DispatchQueue,
  # Conductor) — any test in that family that forgot to stop its process left
  # it running past that test's `on_exit`, racing the sandbox connection
  # teardown. With `pool_size: 1` (config/test.exs) there is only one physical
  # SQLite connection for the whole suite, so a leaked process crashing that
  # connection mid-write corrupted whichever *unrelated* test happened to be
  # mid-write at that moment — which is why the failures looked order-
  # dependent and moved around between runs instead of reproducing
  # consistently. `test/support/data_case.ex` now sweeps every one of these
  # supervisors' children (via `DynamicSupervisor.terminate_child/2`, not
  # `GenServer.stop/3` — several of these workers default to `restart:
  # :permanent` and a plain `GenServer.stop` would trigger an immediate
  # supervisor-driven restart against a now-torn-down sandbox connection)
  # before the sandbox owner is stopped, unconditionally for every test. A
  # second, rarer slice of the same failure class survived that fix:
  # `Arbiter.GitHub.Limiter.start_task/2` (used by the dashboard's PR-state
  # resolver) spawned a bare, unsupervised `Task.start/1` with no name a test
  # could find and wait on, so it could still be mid-write past a test's
  # `on_exit`. It now runs under a named `Arbiter.TaskSupervisor`, which
  # `data_case.ex` drains the same way as the other detached background
  # writers.
  #
  # bd-4uoj4m: the umbrella ran its apps back to back in one VM (arbiter
  # ~369s, arbiter_web ~217s, cli ~8s) and ~85-93% of that is `async: false`
  # time, so in-VM concurrency is no lever; separate VMs are. The suite is now
  # a matrix of per-app, `--partitions`-sharded jobs. config/test.exs already
  # suffixes the SQLite DB with MIX_TEST_PARTITION (which `mix test
  # --partitions` sets itself) and each job is its own VM, so there are no DB
  # or /tmp collisions. `--slowest 25` prints per-test timings in each log.
  #
  # Every `mix test` run is `cd apps/<app> && mix test --partitions N`; the
  # partitions of one app together run each of its test files exactly once.
  # `cli` also covers arbiter_release_env (1 partition each).
  #
  # CHECK-RUN NAMING: the merger reads every check run, so every shard has to
  # be green anyway. The `mix test` job below aggregates the shards and keeps
  # the original check name, so branch protection configured on "mix test"
  # keeps working and there is one place that reports overall pass/fail.
  test-shard:
    name: mix test (${{ matrix.app }} ${{ matrix.partition }}/${{ matrix.partitions }})
    runs-on: ubuntu-latest
    env:
      MIX_ENV: test
      # Non-secret test key for Arbiter.Vault (matches config/test.exs).
      ARBITER_CLOAK_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=

    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: arbiter, partition: 1, partitions: 3 }
          - { app: arbiter, partition: 2, partitions: 3 }
          - { app: arbiter, partition: 3, partitions: 3 }
          - { app: arbiter_web, partition: 1, partitions: 2 }
          - { app: arbiter_web, partition: 2, partitions: 2 }
          - { app: arbiter_cli, partition: 1, partitions: 1 }

    steps:
      - uses: actions/checkout@v4

      - name: Install Erlang/Elixir
        uses: erlef/setup-beam@v1
        with:
          otp-version: "29.1.1"
          elixir-version: "1.20.4"

      - name: Restore deps/build cache
        id: cache3
        uses: actions/cache/restore@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp29.1.1-elixir1.20.4-mix-

      - name: Install hex/rebar
        run: |
          mix local.hex --force
          mix local.rebar --force

      - name: Fetch dependencies
        run: mix deps.get

      # Replaces the test-env half of the removed `lint` job: `audit` compiles
      # under MIX_ENV=dev, so test/support and test-only compile_env branches
      # are only warning-checked here. The build is needed anyway, so this is
      # free. (The per-app `test` aliases run ecto.create/ecto.migrate.)
      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        working-directory: apps/${{ matrix.app }}
        run: |
          mix test --partitions ${{ matrix.partitions }} --slowest 25
        env:
          MIX_TEST_PARTITION: ${{ matrix.partition }}

      - name: Run arbiter_release_env tests
        if: ${{ matrix.app == 'arbiter_cli' }}
        working-directory: apps/arbiter_release_env
        run: mix test --slowest 25

      # Only one shard saves, so shards do not race on the identical key.
      - name: Save deps/build cache
        if: ${{ !cancelled() && github.event_name == 'push' && matrix.app == 'arbiter' && matrix.partition == 1 && steps.cache3.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v4
        with:
          path: |
            deps
            _build
          key: ${{ runner.os }}-otp29.1.1-elixir1.20.4-mix-${{ hashFiles('**/mix.lock') }}

  # Single aggregate check, named as the old monolithic job was.
  test:
    name: mix test
    runs-on: ubuntu-latest
    needs: test-shard
    if: ${{ always() }}
    steps:
      - name: Require all shards green
        env:
          RESULT: ${{ needs.test-shard.result }}
        run: |
          echo "test-shard result: $RESULT"
          [ "$RESULT" = "success" ]
